[project]
name = "dgx-kit"
version = "0.1.29"
description = "One-click dashboard and model manager for NVIDIA DGX Spark"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "nvidia-ml-py>=12.560",
    "pyyaml>=6",
    "docker>=7",
    "huggingface_hub>=0.24",
    "jeepney>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dgxkit*"]
