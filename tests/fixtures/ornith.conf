IMAGE="vllm-spark:0.29-pfxtest"
ENGINE="vllm"
MODEL="Ornith-1.5 (abliterated) DFlash2"
OPTS="DFLASH2 n=7, prefix-cache ON (0.29 image + mamba-align fix + PR47926 mask). vLLM 0.30 corrupts DFlash output (!!!!), do not use"
PORT=8082
LITELLM_MODEL_NAME="ornith-1.5"
DOCKER_MEM="38g"
CMD=(
  vllm serve /home/user/models/vllm/ornith-abl-dflash
  --served-model-name ornith-1.5
  --host 0.0.0.0 --port $PORT
  --gpu-memory-utilization 0.28
  --moe-backend humming
  --kv-cache-dtype fp8
  --kv-cache-memory 8000000000
  --max-num-seqs 2
  --mamba-ssm-cache-dtype bfloat16
  --max-model-len 262144
  --enable-auto-tool-choice
  --tool-call-parser qwen3_coder
  --reasoning-parser qwen3
  --chat-template /home/user/models/vllm/ornith-abl-dflash/chat_template-sharp.jinja
  --language-model-only
  --speculative_config.model /home/user/models/vllm/ornith-dflash2
  --speculative_config.num_speculative_tokens 7
  --speculative_config.draft_sample_method probabilistic
  --override-generation-config {"temperature":0.6,"top_p":0.95,"top_k":20,"max_new_tokens":32768}
)
